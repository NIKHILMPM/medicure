- name: Setup Docker and Kubernetes on EC2
  hosts: all
  become: true

  tasks:
    - name: Disable swap (required for Kubernetes)
      shell: |
        swapoff -a
        sed -i '/ swap / s/^/#/' /etc/fstab

    - name: Update APT packages
      apt:
        update_cache: yes

    - name: Install prerequisites
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Install containerd (runtime)
      apt:
        name: containerd
        state: present

    - name: Configure containerd defaults
      shell: |
        mkdir -p /etc/containerd
        containerd config default | tee /etc/containerd/config.toml
        systemctl restart containerd

    - name: Create directory for Kubernetes GPG key
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes GPG key (new repo)
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.29/deb/Release.key | \
        gpg --dearmor -o /etc/apt/keyrings/kubernetes.gpg
      args:
        warn: false

    - name: Set correct permissions on keyring
      file:
        path: /etc/apt/keyrings/kubernetes.gpg
        mode: '0644'

    - name: Add Kubernetes APT repo (modern method)
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes.gpg] https://pkgs.k8s.io/core:/stable:/v1.29/deb/ /

    - name: Update APT cache with Kubernetes repo
      apt:
        update_cache: yes

    - name: Install Kubernetes tools
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present

    - name: Hold Kubernetes versions
      shell: apt-mark hold kubelet kubeadm kubectl
