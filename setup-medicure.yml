- name: Initialize Kubernetes and Install CNI
  hosts: all
  become: true

  tasks:
    - name: Initialize Kubernetes Master
      shell: |
        kubeadm init --pod-network-cidr=192.168.0.0/16 --ignore-preflight-errors=all

    - name: Set up kubectl config for ubuntu user
      shell: |
        mkdir -p $HOME/.kube
        cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
        chown $(id -u):$(id -g) $HOME/.kube/config

    - name: Wait for Kubernetes API server to become ready
      shell: |
        for i in {1..20}; do
          kubectl get nodes && break || sleep 10
        done

    - name: Apply Calico CNI plugin
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.24.1/manifests/calico.yaml

    - name: Wait for Calico to initialize
      shell: sleep 30

    - name: Show Kubernetes node status
      shell: kubectl get nodes
