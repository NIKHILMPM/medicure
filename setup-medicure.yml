- name: Initialize Kubernetes and Fix CNI Setup
  hosts: all
  become: true

  tasks:
    - name: Install and configure containerd
      shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        systemctl restart containerd
        systemctl enable containerd

    - name: Configure kubelet to use containerd as runtime
      copy:
        dest: /etc/default/kubelet
        content: |
          KUBELET_EXTRA_ARGS=--container-runtime=remote --container-runtime-endpoint=unix:///run/containerd/containerd.sock

    - name: Restart kubelet with updated CRI
      shell: |
        systemctl daemon-reexec
        systemctl daemon-reload
        systemctl restart kubelet

    - name: Apply CNI kernel requirements - enable br_netfilter
      shell: |
        echo 'br_netfilter' > /etc/modules-load.d/k8s.conf
        modprobe br_netfilter

    - name: Set sysctl params for Kubernetes networking
      shell: |
        cat <<EOF | tee /etc/sysctl.d/k8s.conf
        net.bridge.bridge-nf-call-iptables = 1
        net.ipv4.ip_forward = 1
        net.bridge.bridge-nf-call-ip6tables = 1
        EOF
        sysctl --system

    - name: Initialize Kubernetes Master (ignore harmless CoreDNS error)
      shell: |
        kubeadm init --pod-network-cidr=192.168.0.0/16 --ignore-preflight-errors=all || true

    - name: Create .kube directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Set up kubeconfig for ubuntu user
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Wait for Kubernetes API server to be ready
      shell: |
        for i in {1..30}; do
          kubectl get nodes && break || sleep 10
        done

    - name: Apply Calico CNI plugin (retry until API is ready)
      shell: |
        for i in {1..30}; do
          kubectl apply --validate=false -f https://raw.githubusercontent.com/projectcalico/calico/v3.24.1/manifests/calico.yaml && break || sleep 10
        done

    - name: Restart kubelet to ensure networking loads
      shell: systemctl restart kubelet

    - name: Final check - wait for node to become Ready
      shell: |
        for i in {1..30}; do
          kubectl get nodes | grep -q ' Ready ' && break || sleep 10
        done

    - name: Show Kubernetes node status (retry until reachable)
      shell: |
        for i in {1..30}; do
          kubectl get nodes && break || sleep 10
        done
