- name: Initialize Kubernetes and Install CNI
  hosts: all
  become: true

  tasks:
    - name: Initialize Kubernetes Master (ignore harmless CoreDNS error)
      shell: |
        kubeadm init --pod-network-cidr=192.168.0.0/16 --ignore-preflight-errors=all || true

    - name: Create .kube directory for ubuntu user
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Set up kubeconfig for ubuntu user
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Wait for Kubernetes API server to become ready
      shell: |
        for i in {1..30}; do
          kubectl get nodes && break || sleep 10
        done

    - name: Apply Calico CNI plugin (retry until API is ready)
      shell: |
        for i in {1..30}; do
          kubectl apply --validate=false -f https://raw.githubusercontent.com/projectcalico/calico/v3.24.1/manifests/calico.yaml && break || sleep 10
        done

    - name: Restart kubelet service after CNI install
      shell: systemctl restart kubelet

    - name: Confirm Kubernetes node status (retry loop)
      shell: |
        for i in {1..30}; do
          kubectl get nodes && break || sleep 10
        done
